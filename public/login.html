<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - United Pakistan Finance Management</title>
    <meta name="theme-color" content="#C8102E">
    <meta name="description" content="Sign in to United Pakistan Finance Management.">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/generated-tokens.css?v=20260928-ui">
    <link rel="stylesheet" href="/css/style.css?v=20260928-ui">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body class="bg-gray">
    <div class="login-container flex-center full-height">
        <div class="card login-card">
            <div class="text-center mb-md">
                <div class="logo-large">UP</div>
                <h2 class="mt-sm">Welcome Back</h2>
                <p class="text-muted">Manage funds, members, expenses, and follow-ups.</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="form-group mt-sm">
                    <label for="password">Password</label>
                    <div class="password-field"><input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required><button type="button" id="toggle-password" aria-label="Show password">Show</button></div>
                </div>
                <div id="login-error" class="text-danger mt-sm hidden text-sm"></div>
                <button type="submit" class="btn btn-primary w-full mt-md">Sign in</button>
            </form>
            <details class="mt-lg">
                <summary>Request a new sector</summary>
                <form id="sector-request-form" class="mt-md">
                    <label for="request-sector-name">Sector name</label><input id="request-sector-name" class="form-control" required>
                    <label for="request-email" class="mt-sm">Contact email</label><input id="request-email" type="email" class="form-control" required>
                    <label for="request-notes" class="mt-sm">Notes (optional)</label><textarea id="request-notes" class="form-control" maxlength="1000"></textarea>
                    <input id="request-website" autocomplete="off" tabindex="-1" aria-hidden="true" class="hidden">
                    <div id="request-result" class="text-sm mt-sm" role="status"></div>
                    <button type="submit" class="btn btn-secondary w-full mt-md">Submit request</button>
                </form>
            </details>
            <form id="password-change-form" class="hidden">
                <div class="text-center mb-md">
                    <h3>Choose a new password</h3>
                    <p class="text-muted">Your temporary password must be replaced before finance data can be accessed.</p>
                </div>
                <div class="form-group">
                    <label for="current-password">Current password</label>
                    <input type="password" id="current-password" name="currentPassword" class="form-control" autocomplete="current-password" required>
                </div>
                <div class="form-group mt-sm">
                    <label for="new-password">New password</label>
                    <input type="password" id="new-password" name="newPassword" class="form-control" autocomplete="new-password" minlength="12" required>
                </div>
                <div class="form-group mt-sm">
                    <label for="confirm-password">Confirm new password</label>
                    <input type="password" id="confirm-password" name="confirmPassword" class="form-control" autocomplete="new-password" minlength="12" required>
                </div>
                <div id="password-change-error" class="text-danger mt-sm hidden text-sm"></div>
                <button type="submit" class="btn btn-primary w-full mt-md">Change password</button>
            </form>
        </div>
    </div>
    
    <script type="module">
        import { api } from '/js/api.js';
        
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('toggle-password');
        togglePassword.addEventListener('click', () => {
            const visible = passwordInput.type === 'text';
            passwordInput.type = visible ? 'password' : 'text';
            togglePassword.textContent = visible ? 'Show' : 'Hide';
            togglePassword.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
            passwordInput.focus();
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = e.target.username.value;
            const password = e.target.password.value;
            const errorDiv = document.getElementById('login-error');
            const submitBtn = e.target.querySelector('button');
            
            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in…';
            
            try {
                const res = await api.post('/api/auth/login', { username, password });
                if (res.success) {
                    localStorage.setItem('auth_token', res.token);
                    if (res.refreshToken) localStorage.setItem('auth_refresh_token', res.refreshToken);
                    if (res.role) localStorage.setItem('user_role', res.role);
                    if (res.mustChangePassword) {
                        document.getElementById('login-form').classList.add('hidden');
                        document.getElementById('password-change-form').classList.remove('hidden');
                        document.getElementById('current-password').value = password;
                        document.getElementById('new-password').focus();
                        return;
                    }
                    window.location.href = '/';
                }
            } catch (error) {
                errorDiv.textContent = error.message || 'Invalid credentials';
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
            }
        });

        document.getElementById('password-change-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('password-change-error');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const currentPassword = e.target.currentPassword.value;
            const newPassword = e.target.newPassword.value;
            const confirmPassword = e.target.confirmPassword.value;
            errorDiv.classList.add('hidden');
            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'New passwords do not match.';
                errorDiv.classList.remove('hidden');
                return;
            }
            submitBtn.disabled = true;
            submitBtn.textContent = 'Changing password…';
            try {
                const res = await api.post('/api/auth/change-password', { currentPassword, newPassword });
                localStorage.setItem('auth_token', res.token);
                if (res.refreshToken) localStorage.setItem('auth_refresh_token', res.refreshToken);
                if (res.role) localStorage.setItem('user_role', res.role);
                window.location.href = '/';
            } catch (error) {
                errorDiv.textContent = error.message || 'Unable to change password.';
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Change password';
            }
        });

        document.getElementById('sector-request-form').addEventListener('submit', async (e) => {
            e.preventDefault(); const result = document.getElementById('request-result'); const button = e.target.querySelector('button'); button.disabled = true;
            try { await fetch('/api/onboarding/requests', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sectorName: document.getElementById('request-sector-name').value, email: document.getElementById('request-email').value, notes: document.getElementById('request-notes').value, website: document.getElementById('request-website').value }) }).then(async (response) => { const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Unable to submit request'); return data; }); e.target.reset(); result.textContent = 'Request submitted for platform review.'; result.className = 'text-sm mt-sm text-success'; } catch (error) { result.textContent = error.message; result.className = 'text-sm mt-sm text-danger'; } finally { button.disabled = false; }
        });
    </script>
</body>
</html>
