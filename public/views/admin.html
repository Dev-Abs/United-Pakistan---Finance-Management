<div class="page-container max-w-5xl">
    <div class="page-intro"><div><p class="section-eyebrow">Platform administration</p><h2>Sector administration</h2><p class="text-muted">Provision sectors and one-time secretary credentials.</p></div></div>
    <section class="card mb-lg"><div class="card-header"><h3>Create sector</h3></div><form id="admin-sector-form" class="form-grid"><label>Sector name<input id="admin-sector-name" required></label><label>Slug (optional)<input id="admin-sector-slug" pattern="[a-z0-9-]+"></label><button class="btn btn-primary" type="submit">Create sector</button></form></section>
    <section class="card mb-lg"><div class="card-header"><h3>Sectors</h3><button class="btn btn-secondary" id="admin-refresh" type="button">Refresh</button></div><div class="table-container"><table><thead><tr><th>Name</th><th>Slug</th><th>Status</th><th>Secretary</th><th>Actions</th></tr></thead><tbody id="admin-sectors"></tbody></table></div></section>
    <section class="card"><div class="card-header"><h3>Audit log</h3></div><div class="table-container"><table><thead><tr><th>When</th><th>Action</th><th>Actor</th><th>Sector</th><th>Metadata</th></tr></thead><tbody id="admin-audit"></tbody></table></div></section>
</div>
