version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  dynamic_color: ^1.9.0
  fl_chart: ^1.2.0
  flex_color_scheme: ^8.4.0
